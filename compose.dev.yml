services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-fashion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fashion_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: ecommerce_fashion
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fashion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion_user -d ecommerce_fashion"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fashion_postgres_data:
